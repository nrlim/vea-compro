services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: vea_compro
    restart: always
    env_file:
      - .env.production
    environment:
      - PORT=3302
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
    ports:
      - "127.0.0.1:3302:3302"
    volumes:
      - ./public/uploads:/app/public/uploads
    command: node server.js
    networks:
      - apps_database_network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3302/api/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  apps_database_network:
    external: true
    name: postgres-network
